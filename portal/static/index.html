<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-Source Dating Portal</title>
<style>
:root{--bg:#faf8f6;--card:#fff;--ink:#1d1a1f;--mute:#6c6670;--line:#e8e3e6;--accent:#d6336c;--accent2:#5b4bdb;
--guess-bg:#fff4d6;--guess-ink:#7a5600;--plan-bg:#e7e4ff;--plan-ink:#3d2fb0;--ok-bg:#dff5e6;--ok-ink:#17653a;--open-bg:#fde4e4;--open-ink:#9b1c1c;--code:#f3eff1;
--hero:linear-gradient(135deg,#fbe3ee 0%,#eef0ff 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151317;--card:#1e1b21;--ink:#f1edf2;--mute:#a49dab;--line:#2f2a33;
--accent:#f06595;--accent2:#8e84ff;--guess-bg:#3b3010;--guess-ink:#ffd873;--plan-bg:#272150;--plan-ink:#b9b2ff;--ok-bg:#12351f;--ok-ink:#7fdca1;--open-bg:#3d1717;--open-ink:#ffa8a8;--code:#26222a;
--hero:linear-gradient(135deg,#2c1724 0%,#1d1b38 100%)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:20px 16px 0;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px} h1 small{font-size:12px;font-weight:400;color:var(--mute);margin-left:8px}
.tag{color:var(--mute);margin:4px 0 14px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto;padding:0 16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
section{display:none} section.on{display:block}
.lead{font-size:17px;max-width:760px}
.hero{background:var(--hero);border-radius:16px;padding:22px 20px;margin-bottom:8px}
.hero h2{margin:0 0 8px;font-size:24px;line-height:1.25}
.hero p{margin:0 0 14px;max-width:760px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 6px;font-size:15px} .card p{margin:0;color:var(--mute)}
.card ul{margin:6px 0 0;padding-left:18px;color:var(--mute)} .card li{margin:3px 0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-bottom:8px;white-space:nowrap}
.assumed{background:var(--guess-bg);color:var(--guess-ink)} .decided{background:var(--ok-bg);color:var(--ok-ink)} .planned{background:var(--plan-bg);color:var(--plan-ink)}
.open{background:var(--open-bg);color:var(--open-ink)} .partly{background:var(--ok-bg);color:var(--ok-ink)}
.stages{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))} @media(max-width:520px){.stages{grid-template-columns:1fr}}
.stage .diagram{margin-top:10px} .tagline{font-size:12px;color:var(--mute)}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.doc{background:none;border:0;padding:0;margin-top:8px;font:inherit;font-size:12px;color:var(--accent2);cursor:pointer;text-align:left}
.doc:hover{text-decoration:underline} .doc.plain{color:var(--mute);cursor:default;text-decoration:none}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0 4px}
.stat b{display:block;font-size:24px;line-height:1.2} .stat span{color:var(--mute);font-size:13px}
.banner{background:var(--guess-bg);color:var(--guess-ink);padding:10px 14px;border-radius:10px;margin-bottom:18px;font-size:14px}
h2{font-size:18px;margin:30px 0 10px} h2:first-child{margin-top:0}
.sub{color:var(--mute);margin:-4px 0 12px;max-width:760px}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:44px 1fr 150px;gap:14px;align-items:start}
.step:not(:has(svg)){grid-template-columns:44px 1fr}
.step .num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step svg{width:150px;height:auto;border-radius:20px;box-shadow:0 3px 12px rgba(0,0,0,.14)}
@media(max-width:620px){.step{grid-template-columns:36px 1fr}.step .shot{grid-column:2}.step svg{width:140px}}
.nope{columns:2 260px;margin:0;padding-left:20px;color:var(--mute)}
.qs{margin:0;padding:0;list-style:none} .qs li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.qs li:first-child{border-top:0} .qs .rec{flex:none;font-size:12px;color:var(--guess-ink);background:var(--guess-bg);padding:2px 8px;border-radius:99px;white-space:nowrap}
@media(max-width:520px){.qs li{flex-direction:column;gap:4px}}
.road{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:8px;padding-left:20px}
.road .card{position:relative;margin-bottom:12px}
.road .card::before{content:"";position:absolute;left:-31px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.road .done::before{background:var(--ok-ink)} .road .now::before{background:var(--accent)}
.road .now{border-color:var(--accent)}
.phones{display:flex;gap:18px;flex-wrap:wrap}
.phone{width:200px} .phone svg{width:100%;height:auto;display:block;border-radius:26px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.phone figcaption{text-align:center;margin-top:8px;font-weight:600}
.diagram{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.diagram text{fill:var(--ink);font:12px system-ui,sans-serif} .diagram .m{fill:var(--mute)} .diagram .s{font-size:10px}
.files{display:grid;gap:12px;grid-template-columns:260px 1fr}
@media(max-width:700px){.files{grid-template-columns:1fr}}
.tree{max-height:70vh;overflow:auto} .tree div{padding:4px 6px;cursor:pointer;border-radius:6px;word-break:break-all}
.tree div:hover{background:var(--code)} .crumbs{color:var(--mute);margin-bottom:6px;font-size:13px}
pre{margin:0;background:var(--code);padding:12px;border-radius:8px;overflow:auto;max-height:70vh;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.feed{display:flex;flex-direction:column;gap:10px;max-height:72vh;overflow:auto}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--code);align-self:flex-end} .msg.assistant{background:var(--card);border:1px solid var(--line)}
.msg small{display:block;color:var(--mute);margin-bottom:2px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.live.on{background:#2fb344}
ul.q{margin:0;padding-left:20px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1><span id="name">opensourcedating</span><small id="namenote"></small></h1>
  <div class="tag" id="tagline"></div>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
  <section id="t-overview"></section>
  <section id="t-how"></section>
  <section id="t-arch"></section>
  <section id="t-decisions"></section>
  <section id="t-open"></section>
  <section id="t-next"></section>
  <section id="t-mockups"></section>
  <section id="t-files"></section>
  <section id="t-feed"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => e.append(k));
  return e;
};
const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.json(); };
// Public static copy (GitHub Pages, built by portal/build_static.py): same views, read from
// pre-built JSON instead of the local server. No live chat there.
const STATIC = !!window.PORTAL_STATIC, cache = {};
const once = n => cache[n] || (cache[n] = get('data/' + n + '.json'));
const api = async p => {
  if (!STATIC) return get(p);
  const u = new URL(p, location.href), q = u.searchParams.get('path') || '';
  if (u.pathname.endsWith('/api/overview')) return once('overview');
  const map = await once(u.pathname.endsWith('/api/tree') ? 'tree' : 'files');
  if (!(q in map)) throw new Error(404);
  return map[q];
};
const LABEL = {decided: 'Decided', planned: 'Planned', open: 'Open', partly: 'Decided, details open'};
const badge = s => el('span', {className: 'badge ' + s, textContent: LABEL[s] || 'Guess'});
// Repo docs open in the Files tab; research notes live outside the repo, so they are named only.
const docLink = p => p.startsWith('docs/')
  ? el('button', {className: 'doc', textContent: '📄 ' + p.split('/').pop(), onclick: () => openDoc(p)})
  : el('span', {className: 'doc plain', textContent: 'Project research: ' + p.split('/').pop()});
const card = (...kids) => el('div', {className: 'card'}, ...kids);
const goBtn = (tab, label, ghost) => el('button', {className: 'btn' + (ghost ? ' ghost' : ''), textContent: label, onclick: () => { show(tab); scrollTo(0, 0); }});

const TABS = [['overview','Overview'],['how','How it works'],['arch','Architecture'],['decisions','Decisions'],['open','Open questions'],
  ['next','Next steps'],['mockups','Mockups'],['files','Files'],['feed','Live chat']]
  .filter(([t]) => !(STATIC && t === 'feed'));
const loaded = {};
function show(id) {
  TABS.forEach(([t]) => {
    $('#t-' + t).classList.toggle('on', t === id);
    document.querySelector(`[data-tab=${t}]`).setAttribute('aria-selected', t === id);
  });
  history.replaceState(null, '', '#' + id);
  if (DATA && !loaded[id]) { loaded[id] = true; RENDER[id](); }  // rendered once data arrives
}
TABS.forEach(([id, label]) => $('#tabs').append(el('button', {textContent: label, role: 'tab', onclick: () => show(id)}, )));
[...$('#tabs').children].forEach((b, i) => b.dataset.tab = TABS[i][0]);

let readDoc;  // set by the Files tab once it renders
function openDoc(path) { show('files'); readDoc(path); scrollTo(0, 0); }

let DATA;
const RENDER = {
  async overview() {
    const s = $('#t-overview'), p = DATA.project, i = DATA.intro, r = DATA.repo, t = DATA.topics.items;
    s.append(el('div', {className: 'hero'},
      el('h2', {textContent: 'A dating app where you read and write, instead of swiping.'}),
      el('p', {className: 'lead', textContent: i.what}),
      el('div', {className: 'btns'}, goBtn('how', 'How it works'), goBtn('arch', 'Architecture', true), goBtn('next', 'Where we are going', true))));
    const n = st => t.filter(x => x.status === st).length;
    s.append(el('div', {className: 'stats'},
      [[p.stage, p.stage_detail], [`${n('decided') + n('partly')} of ${t.length}`, 'spec topics decided'],
       [DATA.open.awaiting.length, 'proposals waiting for a decision'], [r.commits_total, 'commits'],
       ...(r.built ? [[new Date(r.built).toLocaleDateString(), 'last update']] : [])].map(([k, v]) =>
        el('div', {className: 'card stat'}, el('b', {textContent: k}), el('span', {textContent: v})))));
    s.append(el('h2', {textContent: 'Why build another dating app?'}));
    s.append(el('div', {className: 'grid'}, i.why.map(w => card(el('h3', {textContent: w.title}), el('p', {textContent: w.text})))));
    s.append(el('h2', {textContent: 'What makes it different'}));
    s.append(el('div', {className: 'grid'}, i.principles.map(w => card(el('h3', {textContent: w.title}), el('p', {textContent: w.text})))));
    s.append(el('h2', {textContent: 'Latest changes'}));
    s.append(el('div', {className: 'card scroll'}, el('table', {}, r.recent_commits.slice(0, 8).map(c =>
      el('tr', {}, el('td', {textContent: c.subject}), el('td', {className: 'tagline', textContent: c.when}))))));
  },

  async how() {
    const s = $('#t-how');
    s.append(el('p', {className: 'lead', textContent: 'What using the app will look like, step by step. Screens are rough mockups, not final designs.'}));
    s.append(el('div', {className: 'steps'}, DATA.journey.map((j, n) => {
      const shot = el('div', {className: 'shot'});
      if (j.screen && SCREENS[j.screen]) shot.innerHTML = SCREENS[j.screen]();  // static markup defined in this file only
      return el('div', {className: 'card step'}, el('div', {className: 'num', textContent: n + 1}),
        el('div', {}, badge(j.status), el('h3', {textContent: j.title}), el('p', {textContent: j.text}), ...(j.doc ? [docLink(j.doc)] : [])),
        ...(j.screen ? [shot] : []));
    })));
    s.append(el('h2', {textContent: 'What we deliberately don\'t build'}));
    s.append(card(el('ul', {className: 'nope'}, DATA.not_building.map(x => el('li', {textContent: x})))));
  },

  async arch() {
    const s = $('#t-arch'), a = DATA.architecture;
    s.append(el('p', {className: 'lead', textContent: a.summary}));
    s.append(el('div', {className: 'stages'}, a.stages.map(st =>
      el('div', {className: 'card stage'}, badge(st.status), el('h3', {textContent: st.title}),
        el('p', {textContent: st.summary}), diagram(st.id)))));
    s.append(el('h2', {textContent: 'Built into stage 1 so stage 2 is not a rewrite'}));
    s.append(card(el('ul', {className: 'q'}, a.groundwork.map(g => el('li', {textContent: g})))));
    s.append(el('h2', {textContent: 'Technology decisions'}));
    s.append(el('div', {className: 'card scroll'}, el('table', {},
      el('tr', {}, ['Topic','Stage','Choice','Status','Why','Alternatives'].map(h => el('th', {textContent: h}))),
      a.decisions.map(d => el('tr', {}, el('td', {textContent: d.topic}), el('td', {textContent: d.stage}),
        el('td', {}, d.choice, ...(d.doc ? [el('br'), docLink(d.doc)] : [])), el('td', {}, badge(d.status)), el('td', {textContent: d.why}),
        el('td', {textContent: d.alternatives}))))));
  },

  async decisions() {
    const s = $('#t-decisions'), t = DATA.topics;
    s.append(el('div', {className: 'banner', textContent: DATA.project.note}));
    s.append(el('h2', {textContent: 'Spec review, topic by topic'}));
    s.append(el('p', {className: 'sub', textContent: t.intro}));
    s.append(el('div', {className: 'grid'}, t.items.map(x =>
      card(badge(x.status), el('h3', {textContent: x.n + '. ' + x.title}),
        el('ul', {}, x.points.map(pt => el('li', {textContent: pt}))), ...(x.doc ? [docLink(x.doc)] : [])))));
    s.append(el('h2', {textContent: 'Project decisions'}));
    s.append(el('div', {className: 'grid'}, t.other.map(x => card(badge('decided'), el('h3', {textContent: x.title}), el('p', {textContent: x.text})))));
    s.append(el('p', {className: 'sub', style: 'margin-top:16px'}, 'Technology choices are on the ', goBtn('arch', 'Architecture', true), ' tab.'));
  },

  async open() {
    const s = $('#t-open'), o = DATA.open;
    s.append(el('h2', {textContent: 'Proposals waiting for Hendrik\'s decision'}));
    s.append(el('p', {className: 'sub', textContent: 'The research for these is done and a recommendation is written up. Nothing here is decided yet; the yellow tag is the recommendation.'}));
    s.append(el('div', {className: 'stages'}, o.awaiting.map(g =>
      card(badge('open'), el('h3', {textContent: g.topic}),
        el('ul', {className: 'qs'}, g.questions.map(([q, rec]) => el('li', {}, el('span', {textContent: q}), el('span', {className: 'rec', textContent: rec})))),
        docLink(g.doc)))));
    s.append(el('h2', {textContent: 'Still to work out'}));
    s.append(el('div', {className: 'grid'}, o.to_work_out.map(g =>
      card(el('h3', {textContent: g.area}), el('ul', {}, g.items.map(q => el('li', {textContent: q})))))));
  },

  async next() {
    const s = $('#t-next'), g = DATA.suggestions;
    s.append(el('h2', {textContent: 'Roadmap'}));
    const STATE = {done: ['decided', 'Done'], now: ['open', 'Now'], next: ['planned', 'Next'], later: ['assumed', 'Later']};
    s.append(el('div', {className: 'road'}, DATA.roadmap.map(r =>
      el('div', {className: 'card ' + r.state}, el('span', {className: 'badge ' + STATE[r.state][0], textContent: STATE[r.state][1]}),
        el('h3', {textContent: r.title}), el('ul', {}, r.items.map(x => el('li', {textContent: x})))))));
    s.append(el('h2', {textContent: 'Recommendations still to decide'}));
    s.append(el('p', {className: 'sub', textContent: g.intro}));
    s.append(el('div', {className: 'grid'}, g.items.map(i =>
      card(el('span', {className: 'badge assumed', textContent: i.area}),
        el('h3', {textContent: i.title}), el('p', {textContent: i.summary}), docLink(i.doc)))));
    s.append(el('p', {style: 'margin-top:16px'}, el('a', {className: 'btn', href: g.issue_url, target: '_blank', rel: 'noopener', textContent: 'Make a suggestion on GitHub'})));
  },

  async mockups() {
    const s = $('#t-mockups');
    s.append(el('div', {className: 'banner', textContent: 'Design mockups are placeholders to discuss flow, not final visuals. Each screen below has three options to compare, not a final pick.'}));
    DATA.mockups.forEach(cat => {
      s.append(el('h2', {}, cat.title + ' ', badge(cat.status)));
      if (cat.note) s.append(el('p', {className: 'card', style: 'color:var(--mute);margin:0 0 12px', textContent: cat.note}));
      const wrap = el('div', {className: 'phones'});
      cat.variants.forEach(v => {
        const f = el('figure', {className: 'phone'}); f.style.margin = 0;
        f.innerHTML = SCREENS[v.id]();          // static markup defined in this file only
        f.append(el('figcaption', {textContent: v.title}));
        wrap.append(f);
      });
      s.append(wrap);
    });
  },

  async files() {
    const s = $('#t-files'), tree = el('div', {className: 'card tree'}), view = el('div', {className: 'card'});
    s.append(el('div', {className: 'files'}, tree, view));
    async function open(path) {
      const items = await api('/api/tree?path=' + encodeURIComponent(path));
      tree.replaceChildren(el('div', {className: 'crumbs', textContent: '/' + path}));
      if (path) tree.append(el('div', {textContent: '↰ ..', onclick: () => open(path.split('/').slice(0, -1).join('/'))}));
      items.forEach(i => tree.append(el('div', {
        textContent: (i.dir ? '📁 ' : '📄 ') + i.name,
        onclick: () => i.dir ? open(path ? path + '/' + i.name : i.name) : read(path ? path + '/' + i.name : i.name)})));
    }
    async function read(path) {
      const f = await api('/api/file?path=' + encodeURIComponent(path));
      view.replaceChildren(el('div', {className: 'crumbs', textContent: path}),
        el('pre', {textContent: f.binary ? '(binary file)' : f.text + (f.truncated ? '\n\n… truncated' : '')}));
    }
    readDoc = path => { open(path.split('/').slice(0, -1).join('/')); read(path).catch(() => view.textContent = 'Could not open ' + path); };
    view.textContent = 'Select a file.';
    open('');
  },

  async feed() {
    const s = $('#t-feed'), box = el('div', {className: 'feed'}),
          status = el('div', {className: 'crumbs'}, el('span', {className: 'live'}), el('span', {textContent: 'connecting…'}));
    s.append(el('div', {className: 'banner', textContent: 'Chats are shown read-only with emails, phone numbers and keys masked. Only test data should be entered.'}), status, box);
    const add = m => {
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      box.append(el('div', {className: 'msg ' + m.role}, el('small', {textContent: (m.role === 'user' ? 'Henni' : 'Claude') + (m.ts ? ' · ' + new Date(m.ts).toLocaleTimeString() : '')}), m.text));
      if (stick) box.scrollTop = box.scrollHeight;
    };
    (await api('/api/feed')).forEach(add); box.scrollTop = box.scrollHeight;
    const es = new EventSource('/api/stream');
    es.onopen = () => { status.firstChild.className = 'live on'; status.lastChild.textContent = 'live'; };
    es.onerror = () => { status.firstChild.className = 'live'; status.lastChild.textContent = 'reconnecting…'; };
    es.onmessage = e => add(JSON.parse(e.data));
  }
};

/* ---- Architecture diagrams, one per stage (static markup; follows DATA.architecture) ---- */
function diagram(stage) {
  const P = '#d6336c', V = '#5b4bdb';
  const defs = `<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${V}"/></marker></defs>`;
  const phone = (x, y, name, sub = 'app · keys') => `<rect x="${x}" y="${y}" width="96" height="54" rx="12" fill="${P}" fill-opacity=".12" stroke="${P}"/>
    <text x="${x + 48}" y="${y + 23}" text-anchor="middle" font-weight="600">${name}</text>
    <text x="${x + 48}" y="${y + 40}" text-anchor="middle" class="m s">${sub}</text>`;
  const box = (x, y, w, h, title, sub, color = V, dash) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${color}" fill-opacity=".08" stroke="${color}"${dash ? ' stroke-dasharray="5 4"' : ''}/>
    <text x="${x + w / 2}" y="${y + 19}" text-anchor="middle" font-weight="600">${title}</text>
    ${sub ? `<text x="${x + w / 2}" y="${y + 34}" text-anchor="middle" class="m s">${sub}</text>` : ''}`;
  let svg;
  if (stage === 'stage1') {
    svg = `<svg class="diagram" viewBox="0 0 440 320" role="img" aria-label="Stage 1: one server">${defs}
    <rect x="30" y="12" width="380" height="160" rx="14" fill="none" stroke="var(--mute)" stroke-dasharray="3 3"/>
    <text x="220" y="31" text-anchor="middle" font-weight="600">Pilot server in Germany (run by a Berlin e.V.)</text>
    ${box(44, 44, 170, 48, 'Sign-in', 'passkeys · email codes')}
    ${box(226, 44, 170, 48, 'Profiles &amp; search', 'home areas, never GPS')}
    ${box(44, 104, 170, 48, 'Chat relay', 'ciphertext, deleted on delivery')}
    ${box(226, 104, 170, 48, 'Safety service', 'bans · reports · own database', P)}
    ${phone(30, 246, 'Alice')} ${phone(314, 246, 'Bob')}
    <path d="M78 244 L110 176" stroke="${V}" fill="none" marker-end="url(#ar)"/>
    <path d="M362 244 L330 176" stroke="${V}" fill="none" marker-end="url(#ar)"/>
    <path id="s1chat" d="M126 272 C190 214 250 214 314 272" stroke="${P}" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
    <text x="220" y="208" text-anchor="middle">end-to-end encrypted chat</text>
    <text x="220" y="312" text-anchor="middle" class="m s">the relay only ever sees ciphertext, and only until delivery</text>
    <circle r="5" fill="${P}"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#s1chat"/></animateMotion></circle>
    </svg>`;
  } else {
    // "3e" shape: one server program on two levels. Sealed (enclave) level run only by vetted operators;
    // plain level stores and relays ciphertext and is open to anyone in the EU who signs. No shards, no home servers.
    svg = `<svg class="diagram" viewBox="0 0 440 334" role="img" aria-label="Stage 2: one server program on a sealed level and a plain level">${defs}
    ${box(70, 12, 300, 66, 'Sealed level: vetted operators', 'enclaves in data centres, attested')}
    <text x="220" y="62" text-anchor="middle" class="m s">search cards · admission · bans</text>
    ${box(20, 126, 158, 48, 'Plain server', 'ciphertext store · relay')}
    ${box(262, 126, 158, 48, 'Plain server', 'anyone in the EU, signed', V, true)}
    <path d="M99 126 L150 80 M341 126 L290 80" stroke="var(--mute)" stroke-dasharray="3 3" fill="none"/>
    <text x="220" y="106" text-anchor="middle" class="m s">search · checks</text>
    <path d="M178 150 L262 150" stroke="${V}" stroke-width="2.5"/>
    <text x="220" y="142" text-anchor="middle" class="m s">ciphertext</text>
    <circle r="4" fill="${V}"><animateMotion dur="1.6s" repeatCount="indefinite" path="M178 150 L262 150"/></circle>
    ${phone(24, 236, 'Alice')} ${phone(320, 236, 'Bob')}
    <path d="M72 234 L72 178" stroke="${V}" fill="none" marker-end="url(#ar)"/>
    <path d="M368 234 L368 178" stroke="${V}" fill="none" marker-end="url(#ar)"/>
    <path id="s2chat" d="M120 262 C190 208 250 208 320 262" stroke="${P}" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
    <text x="220" y="206" text-anchor="middle">end-to-end encrypted chat across servers</text>
    <text x="220" y="312" text-anchor="middle" class="m s">one program, two levels: no shards, no home servers;</text>
    <text x="220" y="326" text-anchor="middle" class="m s">who holds profile content keys is still open</text>
    <circle r="5" fill="${P}"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#s2chat"/></animateMotion></circle>
    </svg>`;
  }
  const d = el('div'); d.innerHTML = svg; return d.firstChild;
}
